[workspace]
resolver = "2"
members = [
    "handlers/middleware_a", "handlers/middleware_b", "handlers/middleware_c",
    "handlers/service_a", "handlers/service_b", "handlers/service_c",
    "fan-in/service", "fan-in/adder", "fan-in/adder_async", "fan-in/printer1", "fan-in/printer1_async", "fan-in/printer_n",
    "fan-in/adder_mdl_a", "fan-in/adder_mdl_b", "fan-in/adder_mdl_c",
    "fan-in/printer1_mdl_a", "fan-in/printer1_mdl_b", "fan-in/printer1_mdl_c",
    "fan-in/printer_n_mdl_a", "fan-in/printer_n_mdl_b", "fan-in/printer_n_mdl_c",
    "runner", "middleware/printer_mdl", "middleware/blocker_mdl"]

[workspace.dependencies]
clap = { version = "4.5.58", features = ["derive"] }
wat = "1"
wit-bindgen = { version = "0.51.0", features = ['default', 'async-spawn', 'inter-task-wakeup', 'async'] }
wasmtime = { version = "41.0.1", features = ["cranelift", "incremental-cache"] }
wasmtime-wasi = { version = "41.0.1", features = ["p3"] }
wasmtime-wasi-http = { version = "41.0.1", features = ["p3"] }
anyhow = "1.0.86"
tokio = { version = "1.48.0", features = ["net", "rt-multi-thread", "time", "rt", "macros", "fs"] }
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
bytes = { version = "1.10.1", default-features = false }
futures = { version = "0.3.31", default-features = false, features = ['alloc', 'async-await'] }
env_logger = "0.11.5"
flate2 = "1.1.4"

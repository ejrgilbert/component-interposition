version: 1

rules:
  - between:
      interface: "my:service/adder-async"
      inner:
        name: adder-async-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: hello-tier3
          alias: hello-tier3-adder
          config:
            greeting: "hello-adder"

  - between:
      interface: "my:service/async-bucket"
      inner:
        name: shapes-handles-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: hello-tier3
          alias: hello-tier3-bucket
          config:
            greeting: "hello-bucket"

  # Tier-3 wrap on wasi:http/handler exercises the factored-types
  # codegen path: handler `use`s request / response / error-code from
  # wasi:http/types, so the wrapper crate needs the AbsolutizeResources
  # visitor to absolutize all `use`d named types (not just resources).
  - before:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      provider:
        alias: "srv"
    inject:
      - builtin:
          name: hello-tier3
          alias: hello-tier3-handler
          config:
            greeting: "hello-handler"

version: 1

# Search for the http handler of srv-a and insert a single middleware (mdl-a)
rules:
  - before:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      provider:
        # Must use an alias since the instance name is incompatible with WAC variable naming:
        #      `wasi:http/handler@0.3.0-rc-2026-01-06-shim-instance`
        alias: "srv"
    inject:
      - name: mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"

version: 1

rules:
  # Instrument the top-level http handler export of the composition.
  - before:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      provider:
        name: service-comp
    inject:
      - name: handler-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/adder"
      inner:
        name: adder-comp
      outer:
        name: service-comp
    inject:
      - name: adder-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/adder-async"
      inner:
        name: adder-async-comp
      outer:
        name: service-comp
    inject:
      - name: adder-async-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/messenger"
      inner:
        name: messenger-comp
      outer:
        name: service-comp
    inject:
      - name: messenger-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/messenger-async"
      inner:
        name: messenger-async-comp
      outer:
        name: service-comp
    inject:
      - name: messenger-async-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/printer1"
      inner:
        name: printer1-comp
      outer:
        name: service-comp
    inject:
      - name: printer1-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/printer1-async"
      inner:
        name: printer1-async-comp
      outer:
        name: service-comp
    inject:
      - name: printer1-async-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/printer-n"
      inner:
        name: printer-n-comp
      outer:
        name: service-comp
    inject:
      - name: printer-n-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"

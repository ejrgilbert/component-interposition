version: 1

rules:
  - between:
      interface: "my:service/adder"
      inner:
        name: adder-comp
      outer:
        name: service-comp
    inject:
      - name: adder-mdl-a
        path: "./target/wasm32-wasip1/debug/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/adder-async"
      inner:
        name: adder-async-comp
      outer:
        name: service-comp
    inject:
      - name: adder-async-mdl-a
        path: "./target/wasm32-wasip1/debug/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/printer1"
      inner:
        name: printer1-comp
      outer:
        name: service-comp
    inject:
      - name: printer1-mdl-a
        path: "./target/wasm32-wasip1/debug/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/printer1-async"
      inner:
        name: printer1-async-comp
      outer:
        name: service-comp
    inject:
      - name: printer1-async-mdl-a
        path: "./target/wasm32-wasip1/debug/printer_mdl.comp.wasm"
  - between:
      interface: "my:service/printer-n"
      inner:
        name: printer-n-comp
      outer:
        name: service-comp
    inject:
      - name: printer-n-mdl-a
        path: "./target/wasm32-wasip1/debug/printer_mdl.comp.wasm"

version: 1

rules:
  - between:
      interface: "my:service/adder"
      inner:
        name: adder-comp
      outer:
        name: service-comp
    inject:
      - name: adder-mdl-a
        path: "./target/wasm32-wasip1/debug/adder_mdl_a.comp.wasm"
  - between:
      interface: "my:service/printer1"
      inner:
        name: printer1-comp
      outer:
        name: service-comp
    inject:
      - name: printer1-mdl-a
        path: "./target/wasm32-wasip1/debug/printer1_mdl_a.comp.wasm"

version: 1

# This creates a composition that has an unfulfilled dependency (it's the nested
# node of the chain)
rules:
  - before:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      provider:
        name: "srv-a"
    inject:
      - name: srv-c
        path: "./target/wasm32-wasip1/debug/service_c.comp.wasm"

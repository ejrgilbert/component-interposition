version: 1

rules:
  - before:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      provider:
        alias: "srv"
    inject:
      - builtin:
          name: otel-bare-spans
          config:
            span_kind: server

      - builtin:
          name: otel-bare-metrics
          config:
            buffer: 3
            flush_after_seconds: 10.0

      - builtin:
          name: otel-bare-logs
          config:
            severity: WARN

      - builtin:
          name: otel-payload-metrics
          config:
            buffer: 3
            flush_after_seconds: 10.0
            payloads: both

version: 1

rules:
  - before:
      interface: "wasi:http/handler@0.3.0"
      provider:
        alias: "srv"
    inject:
      - builtin:
          name: otel-bare-spans
          config:
            span_kind: server

      - builtin:
          name: otel-bare-metrics
          config:
            buffer: 3
            flush_after_seconds: 10.0

      - builtin:
          name: otel-bare-logs
          config:
            severity: WARN

      # TODO: Uncomment this out when we've merged into next branch

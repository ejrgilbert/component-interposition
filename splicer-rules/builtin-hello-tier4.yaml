version: 1

# Tier-4 (virtualize) builtin: codegen generates a typed wrapper that
# exports my:service/adder-async without importing it — calls don't
# pass through to adder-async-comp. The hello-tier4 strategy returns
# `R::default()` (0 for s32), so the caller sees `1 + 2 = 0`.
rules:
  - between:
      interface: "my:service/adder-async"
      inner:
        name: adder-async-comp
      outer:
        name: service-comp
    inject:
      - builtin: hello-tier4
        config:
          greeting: "hiii"

version: 1

rules:
  - between:
      interface: "my:service/adder-async"
      inner:
        name: adder-async-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: hello-tier4
          config:
            greeting: "hello-adder"

  - between:
      interface: "my:service/bucket-as-arg"
      inner:
        name: shapes-handles-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: hello-tier4
          alias: hello-tier4-bucket
          config:
            greeting: "hello-bucket"

version: 1

# Tier-4 (virtualize) builtin: codegen generates a typed wrapper that
# exports the target without importing it — calls don't pass through
# to the original. The hello-tier4 strategy returns `R::default()`
# (0 for s32), so the caller sees `1 + 2 = 0`.
#
# Two rules:
#   1. On the async-WIT target `my:service/adder-async` — direct
#      mirror-free path; wrapper exports the target as-is.
#   2. On the sync-WIT target `my:service/adder` — exercises the
#      sync→async bridge: splicer synthesizes an async-WIT mirror,
#      the hello-tier4 wrapper exports that mirror, and a bridge
#      component translates sync caller calls into the wrapper's
#      async surface. Caller still sees `1 + 2 = 0`.
rules:
  - between:
      interface: "my:service/adder-async"
      inner:
        name: adder-async-comp
      outer:
        name: service-comp
    inject:
      - builtin: hello-tier4
  - between:
      interface: "my:service/adder"
      inner:
        name: adder-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: hello-tier4
          alias: hello-tier4-bridged

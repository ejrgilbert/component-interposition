version: 1

# Search for the http handler of srv and insert multiple middlewares
rules:
  - between:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      inner:
        name: srv-b
      outer:
        name: srv-a
    inject:
      - name: mdl-a
        path: "./fixtures/middleware_a.comp.wasm"
      - name: mdl-b
        path: "./fixtures/middleware_b.comp.wasm"
      - name: mdl-c
        path: "./fixtures/middleware_c.comp.wasm"

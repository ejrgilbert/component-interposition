version: 1

rules:
  - between:
      interface: "my:service/adder-async"
      inner:
        name: adder-async-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: replayer
          alias: replayer-adder-async

  - between:
      interface: "my:service/messenger"
      inner:
        name: messenger-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: replayer
          alias: replayer-messenger

version: 1

rules:
  # Inject BEFORE the nested node on the chain
  - before:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      provider:
        name: "srv-a"
    inject:
      - name: mdl-a
        path: "./target/wasm32-wasip1/debug/middleware_a.comp.wasm"
  # Inject INSIDE the nested node on the chain
  - between:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      inner:
        name: srv-b
      outer:
        name: srv-a
    inject:
      - name: mdl-b
        path: "./target/wasm32-wasip1/debug/middleware_b.comp.wasm"

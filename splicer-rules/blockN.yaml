version: 1

rules:
  # Demonstration of sync interface interposition
  - between:
      interface: "my:service/printer1"
      inner:
        name: printer1-comp
      outer:
        name: service-comp
    inject:
      - name: printer1-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"
      - name: blocker-mdl
        path: "./fixtures/blocker_mdl.comp.wasm"
      - name: printer1-mdl-c
        path: "./fixtures/printer_mdl.comp.wasm"
  # Demonstration of async interface interposition
  - between:
      interface: "my:service/printer1-async"
      inner:
        name: printer1-async-comp
      outer:
        name: service-comp
    inject:
      - name: printer1-async-mdl-a
        path: "./fixtures/printer_mdl.comp.wasm"
      - name: blocker-async-mdl
        path: "./fixtures/blocker_mdl.comp.wasm"
      - name: printer1-async-mdl-c
        path: "./fixtures/printer_mdl.comp.wasm"

version: 1

# Search for the http handler of srv-a and insert a single middleware (mdl-a)
rules:
  - between:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      inner:
        name: srv-b
      outer:
        name: srv-a
    inject:
      - name: mdl-a
        path: "./target/wasm32-wasip1/debug/middleware_a.comp.wasm"
      - name: mdl-b
        path: "./target/wasm32-wasip1/debug/middleware_b.comp.wasm"
      - name: mdl-c
        path: "./target/wasm32-wasip1/debug/middleware_c.comp.wasm"

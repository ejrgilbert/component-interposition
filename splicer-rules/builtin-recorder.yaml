version: 1

rules:
  - between:
      interface: "my:service/adder-async"
      inner:
        name: adder-async-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: recorder
          alias: recorder-adder-async

  - between:
      interface: "my:service/messenger"
      inner:
        name: messenger-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: recorder
          alias: recorder-messenger

  - between:
      interface: "my:service/shapes-handles"
      inner:
        name: shapes-handles-comp
      outer:
        name: service-comp
    inject:
      - builtin:
          name: recorder
          alias: recorder-shapes-handles

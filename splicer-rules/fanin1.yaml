version: 1

rules:
  # Demonstration of sync interface interposition
  - between:
      interface: "my:service/adder"
      inner:
        name: adder-comp
      outer:
        name: service-comp
    inject:
      - name: adder-mdl-a
        path: "./target/wasm32-wasip1/debug/printer_mdl.comp.wasm"
  # Demonstration of async interface interposition
  - between:
      interface: "my:service/adder-async"
      inner:
        name: adder-async-comp
      outer:
        name: service-comp
    inject:
      - name: adder-async-mdl-a
        path: "./target/wasm32-wasip1/debug/printer_mdl.comp.wasm"

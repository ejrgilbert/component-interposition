version: 1

rules:
  # Inject BEFORE the nested node on the chain
  - before:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      provider:
        name: "srv-a"
    inject:
      - name: mdl-a
        path: "./fixtures/middleware_a.comp.wasm"
      - name: mdl-b
        path: "./fixtures/middleware_b.comp.wasm"
      - name: mdl-c
        path: "./fixtures/middleware_c.comp.wasm"
  # Inject INSIDE the nested node on the chain
  - between:
      interface: "wasi:http/handler@0.3.0-rc-2026-01-06"
      inner:
        name: srv-b
      outer:
        name: srv-a
    inject:
      - name: inner-mdl-a
        path: "./fixtures/middleware_a.comp.wasm"
      - name: inner-mdl-b
        path: "./fixtures/middleware_b.comp.wasm"
      - name: inner-mdl-c
        path: "./fixtures/middleware_c.comp.wasm"

version: 1

rules:
  - match_on:
      interface: wasi:http/handler@0.3.0-rc-2026-01-06
    inject:
      middlewares:
        - middleware-a
  - match_on:
      interface: wasi:http/handler@0.3.0-rc-2026-01-06
      provider_name: srv-b
    inject:
      middlewares:
        - middleware-b
        - middleware-c
  - match_on:
      interface: wasi:http/handler@0.3.0-rc-2026-01-06
      between:
        inner: srv-c
        outer: srv-b
    inject:
      middlewares:
        - middleware-d
        - middleware-e
